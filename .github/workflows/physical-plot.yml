name: Physical Plot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  physical-plot:
    name: Physical plot (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile Steps 7 and 8
        run: python -m compileall -q src/printrbot_penplotter/auto_optimize.py src/printrbot_penplotter/physical_plot.py
      - name: Step 8 tests
        run: python -m pytest -q tests/test_physical_plot.py
      - name: Step 7 regressions
        run: python -m pytest -q tests/test_auto_optimize.py
      - name: Full Python regressions
        run: python -m pytest -q
