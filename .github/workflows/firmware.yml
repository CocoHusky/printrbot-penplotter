name: ESP32 Firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/esp32/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/esp32/**"
      - ".github/workflows/firmware.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Native protocol tests
        run: pio test -d firmware/esp32 -e native
      - name: Build ESP32-C3 firmware
        run: pio run -d firmware/esp32 -e esp32-c3-devkitc-02
      - name: Package firmware
        run: |
          mkdir -p artifacts/esp32-c3
          cp firmware/esp32/.pio/build/esp32-c3-devkitc-02/firmware.bin artifacts/esp32-c3/
          cp firmware/esp32/.pio/build/esp32-c3-devkitc-02/bootloader.bin artifacts/esp32-c3/
          cp firmware/esp32/.pio/build/esp32-c3-devkitc-02/partitions.bin artifacts/esp32-c3/
          sha256sum artifacts/esp32-c3/*.bin > artifacts/esp32-c3/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: printrbot-esp32-c3-firmware
          path: artifacts/esp32-c3
          if-no-files-found: error
