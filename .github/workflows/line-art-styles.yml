name: Line Art Styles

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  line-art:
    name: Line art styles (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile Steps 2 through 5
        run: python -m compileall -q src/printrbot_penplotter/image_preprocess.py src/printrbot_penplotter/image_understanding.py src/printrbot_penplotter/vector_cleanup.py src/printrbot_penplotter/line_art.py
      - name: Step 5 tests
        run: python -m pytest -q tests/test_line_art.py
      - name: Step 4 regression tests
        run: python -m pytest -q tests/test_vector_cleanup.py
      - name: Step 3 regression tests
        run: python -m pytest -q tests/test_image_understanding.py
      - name: Step 2 raster regression tests
        run: python -m pytest -q tests/test_image_preprocess.py tests/test_raster.py tests/test_raster_studio.py
      - name: Deterministic image to line-art smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from PIL import Image, ImageDraw
          from printrbot_penplotter.image_preprocess import ImagePreprocessConfig
          from printrbot_penplotter.image_understanding import ImageUnderstandingConfig
          from printrbot_penplotter.line_art import LineArtConfig, render_line_art

          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / 'fixture.png'
              image = Image.new('L', (64, 48), 245)
              draw = ImageDraw.Draw(image)
              draw.ellipse((6, 5, 57, 42), fill=180, outline=35, width=2)
              draw.ellipse((19, 16, 24, 21), fill=20)
              draw.ellipse((40, 16, 45, 21), fill=20)
              draw.polygon([(27, 25), (37, 25), (32, 31)], fill=30)
              image.save(path)
              kwargs = dict(
                  config=LineArtConfig(style='refined_pen_sketch'),
                  preprocess=ImagePreprocessConfig(auto_levels=True),
                  understanding=ImageUnderstandingConfig(detail_level='medium', min_region_px=3),
              )
              first = render_line_art(path, **kwargs)
              second = render_line_art(path, **kwargs)
              assert first.polylines == second.polylines
              assert first.metadata == second.metadata
              assert first.metadata['understanding_schema'] == 'printrbot-image-understanding/v1'
              assert first.metadata['line_art_schema'] == 'printrbot-line-art/v1'
              print('deterministic Step 2 -> 3 -> 4 -> 5 line art validated')
          PY
