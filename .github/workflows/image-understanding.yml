name: Image Understanding

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image-understanding:
    name: Image understanding (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile Step 2 and Step 3 modules
        run: python -m compileall -q src/printrbot_penplotter/image_preprocess.py src/printrbot_penplotter/image_understanding.py
      - name: Step 3 tests
        run: python -m pytest -q tests/test_image_understanding.py
      - name: Step 2 and raster regression tests
        run: python -m pytest -q tests/test_image_preprocess.py tests/test_raster.py tests/test_raster_studio.py
      - name: Deterministic Step 2 to Step 3 smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          import numpy as np
          from PIL import Image, ImageDraw
          from printrbot_penplotter.image_preprocess import ImagePreprocessConfig
          from printrbot_penplotter.image_understanding import ImageUnderstandingConfig, analyze_image

          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / 'fixture.png'
              image = Image.new('L', (96, 64), 245)
              draw = ImageDraw.Draw(image)
              draw.rectangle((12, 12, 43, 51), fill=35)
              draw.ellipse((52, 15, 84, 48), fill=120)
              image.save(path)
              kwargs = dict(
                  preprocess=ImagePreprocessConfig(auto_levels=True, background_mode='suppress'),
                  understanding=ImageUnderstandingConfig(edge_method='multiscale_canny', detail_level='medium', min_region_px=4),
              )
              first = analyze_image(path, **kwargs)
              second = analyze_image(path, **kwargs)
              assert np.array_equal(first.edge_mask, second.edge_mask)
              assert np.array_equal(first.selected_edges, second.selected_edges)
              assert np.array_equal(first.tone_labels, second.tone_labels)
              assert first.regions == second.regions
              assert first.metadata == second.metadata
              assert first.metadata['preprocessing_schema'] == 'printrbot-image-preprocess/v2'
              assert first.metadata['understanding_schema'] == 'printrbot-image-understanding/v1'
              print('deterministic Step 2 -> Step 3 analysis validated')
          PY
