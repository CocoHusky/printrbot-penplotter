name: Studio 2

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  studio2:
    name: Studio 2 (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile Studio 2 stack
        run: python -m compileall -q src/printrbot_penplotter/studio2.py src/printrbot_penplotter/studio_server.py src/printrbot_penplotter/auto_optimize.py src/printrbot_penplotter/physical_plot.py
      - name: Step 9 tests
        run: python -m pytest -q tests/test_studio2.py
      - name: Steps 7-8 regressions
        run: python -m pytest -q tests/test_auto_optimize.py tests/test_physical_plot.py
      - name: Full Python regressions
        run: python -m pytest -q
