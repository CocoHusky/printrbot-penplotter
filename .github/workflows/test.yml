name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: pytest -q
      - name: Calibration CLI smoke test
        run: |
          printrbot-plotter calibrate --output out/calibration.gcode --preview out/calibration.svg
          test -s out/calibration.gcode
          test -s out/calibration.svg
          grep -q '; mode: AIR PLOT' out/calibration.gcode
          ! grep -q 'pen down' out/calibration.gcode
