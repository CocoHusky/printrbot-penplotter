name: Image Preprocessing

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  preprocessing:
    name: Preprocessing (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile preprocessing modules
        run: python -m compileall -q src/printrbot_penplotter/image_preprocess.py src/printrbot_penplotter/raster.py tests/test_image_preprocess.py
      - name: Step 2 preprocessing tests
        run: python -m pytest -q tests/test_image_preprocess.py tests/test_raster.py tests/test_raster_studio.py
      - name: Deterministic adaptive-threshold smoke test
        run: |
          python - <<'PY'
          import numpy as np
          from printrbot_penplotter.image_preprocess import ThresholdConfig, threshold_image

          gray = np.tile(np.linspace(110, 245, 160, dtype=np.float32), (80, 1)).astype(np.uint8)
          gray[25:32, 15:145] = np.clip(gray[25:32, 15:145].astype(np.int16) - 60, 0, 255).astype(np.uint8)
          config = ThresholdConfig(mode='sauvola', window_px=21, offset=2, sauvola_k=0.15)
          first = threshold_image(gray, config)
          second = threshold_image(gray, config)
          assert np.array_equal(first.mask, second.mask)
          assert first.metadata == second.metadata
          assert first.metadata['threshold_min'] < first.metadata['threshold_max']
          print(first.metadata)
          PY
