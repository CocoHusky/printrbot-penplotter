name: Auto Optimizer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  auto-optimizer:
    name: Auto optimizer (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile Steps 2 through 7
        run: python -m compileall -q src/printrbot_penplotter/image_preprocess.py src/printrbot_penplotter/image_understanding.py src/printrbot_penplotter/vector_cleanup.py src/printrbot_penplotter/line_art.py src/printrbot_penplotter/pen_shading.py src/printrbot_penplotter/auto_optimize.py
      - name: Step 7 tests
        run: python -m pytest -q tests/test_auto_optimize.py
      - name: Step 6 regressions
        run: python -m pytest -q tests/test_pen_shading.py
      - name: Step 5 regressions
        run: python -m pytest -q tests/test_line_art.py
      - name: Full Python regressions
        run: python -m pytest -q
