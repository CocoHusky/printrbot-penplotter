name: Vector Cleanup

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vector-cleanup:
    name: Vector cleanup (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile Steps 2 through 4
        run: >-
          python -m compileall -q
          src/printrbot_penplotter/image_preprocess.py
          src/printrbot_penplotter/image_understanding.py
          src/printrbot_penplotter/vector_cleanup.py
          src/printrbot_penplotter/inputs.py
      - name: Step 4 tests
        run: python -m pytest -q tests/test_vector_cleanup.py
      - name: Step 3 regression tests
        run: python -m pytest -q tests/test_image_understanding.py
      - name: Step 2 and raster regression tests
        run: python -m pytest -q tests/test_image_preprocess.py tests/test_raster.py tests/test_raster_studio.py
      - name: Deterministic trace to cleanup smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from PIL import Image, ImageDraw
          from printrbot_penplotter.inputs import raster_to_polylines_with_metadata
          from printrbot_penplotter.raster import RasterTraceConfig
          from printrbot_penplotter.vector_cleanup import VectorCleanupConfig

          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / 'fixture.png'
              image = Image.new('L', (120, 80), 255)
              draw = ImageDraw.Draw(image)
              draw.line((10, 50, 40, 25, 70, 45, 105, 18), fill=0, width=4)
              image.save(path)
              kwargs = dict(
                  config=RasterTraceConfig(mode='centerline', simplify_px=0.0, min_component_px=2),
                  cleanup=VectorCleanupConfig.for_quality('smooth'),
              )
              first_lines, first_meta = raster_to_polylines_with_metadata(path, **kwargs)
              second_lines, second_meta = raster_to_polylines_with_metadata(path, **kwargs)
              assert first_lines == second_lines
              assert first_meta == second_meta
              assert first_meta['preprocessing_schema'] == 'printrbot-image-preprocess/v2'
              assert first_meta['vector_cleanup_schema'] == 'printrbot-vector-cleanup/v1'
              assert first_lines
              print('deterministic trace -> Step 4 cleanup validated')
          PY
