name: Product Layer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  product:
    name: Product layer (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile product stack
        run: python -m compileall -q src/printrbot_penplotter/product_store.py src/printrbot_penplotter/product_api.py src/printrbot_penplotter/handwriting_packs.py src/printrbot_penplotter/studio_server.py
      - name: Step 10 tests
        run: python -m pytest -q tests/test_product_store.py tests/test_product_api.py tests/test_handwriting_packs.py
      - name: Steps 7-9 regressions
        run: python -m pytest -q tests/test_auto_optimize.py tests/test_physical_plot.py tests/test_studio2.py
      - name: Full Python regressions
        run: python -m pytest -q
