[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "printrbot-penplotter"
version = "1.0.11"
description = "Turn text, handwriting, raster images, and vector art into optimized physically placed Marlin pen-plotter jobs."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "pyhershey>=0.1,<0.2",
  "setuptools>=69,<81",
  "pyserial>=3.5,<4",
  "python-multipart>=0.0.20,<1",
  "svgpathtools>=1.6,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]
neural = [
  "tensorflow>=2.16,<2.17; python_version >= '3.12' and python_version < '3.14'",
  "tensorflow-probability>=0.24,<0.25; python_version >= '3.12' and python_version < '3.14'",
  "tf-keras>=2.16,<2.17; python_version >= '3.12' and python_version < '3.14'",
  "scipy>=1.10,<1.15",
  "pandas>=2,<3",
  "scikit-learn>=1.4,<2",
  "svgwrite>=1.4,<2",
]

[project.scripts]
printrbot-plotter = "printrbot_penplotter.cli:main"
printrbot-bridge = "printrbot_penplotter.esp32_client:main"
printrbot-studio = "printrbot_penplotter.studio_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
