[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "printrbot-penplotter"
version = "0.1.0"
description = "Turn text and vector art into previewed, guarded Marlin pen-plotter jobs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "matplotlib>=3.8,<4",
  "pyserial>=3.5,<4",
  "svgpathtools>=1.6,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
printrbot-plotter = "printrbot_penplotter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
